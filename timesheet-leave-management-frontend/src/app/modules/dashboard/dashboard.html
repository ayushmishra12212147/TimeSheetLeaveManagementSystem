<div class="space-y-6">

  <!-- Welcome Header -->
  <div class="card p-6">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="page-title">{{ greeting }}, {{ userName || employeeId }} 👋</h1>
        <p class="text-gray-500 mt-1 text-sm">Here's your overview for today</p>
      </div>
      <span class="badge badge-info text-sm px-3 py-1">{{ userRole }}</span>
    </div>
  </div>

  <!-- Quick Action Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

    <a *ngFor="let card of cards"
       [routerLink]="card.route"
       class="card border p-5 hover:shadow-md transition-shadow duration-200 cursor-pointer group"
       [ngClass]="card.color">

      <div class="flex items-center justify-between mb-3">
        <span class="text-2xl">{{ card.icon }}</span>
        <span class="text-xs font-medium opacity-70 group-hover:opacity-100 transition-opacity">
          {{ card.value }} →
        </span>
      </div>

      <h3 class="font-semibold text-sm">{{ card.title }}</h3>

    </a>

  </div>

  <!-- Info Section -->
  

</div>
