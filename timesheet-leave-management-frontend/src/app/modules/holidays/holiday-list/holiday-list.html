<div class="space-y-6">
  <div class="flex items-center justify-between flex-wrap gap-4">
    <div><h1 class="page-title">Holidays</h1><p class="text-sm text-gray-500 mt-1">Manage public and company holidays</p></div>
    <div class="flex items-center gap-3">
      <input type="number" [(ngModel)]="selectedYear" (ngModelChange)="onYearChange()" class="input-field w-24" min="2020" max="2035" />
      <button (click)="openCreate()" class="btn-primary" *ngIf="!showForm">+ Add Holiday</button>
    </div>
  </div>
  <div *ngIf="loading" class="card p-8 text-center"><div class="w-8 h-8 border-4 border-primary-200 border-t-primary-600 rounded-full animate-spin mx-auto mb-3"></div></div>
  <div *ngIf="errorMessage && !loading" class="card p-4 bg-red-50 border-red-200 text-red-700 text-sm">⚠️ {{ errorMessage }}</div>

  <div *ngIf="showForm" class="card p-6 max-w-lg border-2 border-primary-200">
    <h2 class="text-lg font-semibold text-gray-800 mb-4">{{ editingId ? 'Edit' : 'Add' }} Holiday</h2>
    <form [formGroup]="holidayForm" (ngSubmit)="submit()" class="space-y-4">
      <div><label class="label">Name <span class="text-red-500">*</span></label><input formControlName="name" class="input-field" placeholder="e.g. Independence Day" /></div>
      <div><label class="label">Date <span class="text-red-500">*</span></label><input formControlName="holidayDate" type="date" class="input-field" /></div>
      <div><label class="label">Description</label><textarea formControlName="description" rows="2" class="input-field resize-none" placeholder="Optional..."></textarea></div>
      <div class="flex gap-3"><button type="submit" class="btn-primary" [disabled]="formLoading">{{ editingId ? 'Update' : 'Create' }}</button><button type="button" (click)="closeForm()" class="btn-secondary">Cancel</button></div>
    </form>
  </div>

  <div *ngIf="!loading && holidays.length > 0" class="card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm">
    <thead class="bg-gray-50 border-b border-gray-200"><tr>
      <th class="text-left px-4 py-3 font-semibold text-gray-600">Name</th><th class="text-left px-4 py-3 font-semibold text-gray-600">Date</th>
      <th class="text-center px-4 py-3 font-semibold text-gray-600">Day</th><th class="text-left px-4 py-3 font-semibold text-gray-600">Description</th>
      <th class="text-right px-4 py-3 font-semibold text-gray-600">Actions</th></tr></thead>
    <tbody><tr *ngFor="let h of holidays" class="border-b border-gray-100 hover:bg-gray-50">
      <td class="px-4 py-3 font-medium text-gray-800">{{ h.name }}</td>
      <td class="px-4 py-3 text-gray-600">{{ h.holidayDate | date:'dd MMM yyyy' }}</td>
      <td class="px-4 py-3 text-center"><span class="badge badge-info text-xs">{{ h.dayOfWeek }}</span></td>
      <td class="px-4 py-3 text-gray-500 text-xs">{{ h.description || '-' }}</td>
      <td class="px-4 py-3 text-right space-x-2"><button (click)="openEdit(h)" class="btn-secondary btn-sm text-xs">Edit</button><button (click)="deleteHoliday(h)" class="btn-danger btn-sm text-xs">Delete</button></td>
    </tr></tbody>
  </table></div></div>

  <div *ngIf="!loading && holidays.length === 0 && !errorMessage" class="card p-8 text-center"><div class="text-4xl mb-3">📅</div><h3 class="font-semibold text-gray-700">No holidays for {{ selectedYear }}</h3></div>
</div>
