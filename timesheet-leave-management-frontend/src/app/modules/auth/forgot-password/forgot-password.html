<div class="min-h-screen flex items-center justify-center bg-gray-50 p-8">
  <div class="w-full max-w-md">
    <div class="card p-8">

      <div class="text-center mb-8">
        <div class="w-14 h-14 bg-primary-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
          <span class="text-2xl">📧</span>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">Forgot Password</h2>
        <p class="text-gray-500 mt-1 text-sm">Enter your employee ID to receive a reset link</p>
      </div>

      <!-- Success State -->
      <div *ngIf="submitted" class="text-center">
        <div class="mb-4 p-4 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm">
          ✅ If an account with that employee ID exists, a password reset link has been sent.
        </div>
        <a routerLink="/login" class="text-sm text-primary-600 hover:text-primary-700 font-medium">
          ← Back to Login
        </a>
      </div>

      <!-- Form State -->
      <div *ngIf="!submitted">

        <div *ngIf="errorMessage"
             class="mb-6 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm flex items-center gap-2">
          <span>⚠️</span>
          <span>{{ errorMessage }}</span>
        </div>

        <form (ngSubmit)="submit()" class="space-y-5">
          <div>
            <label for="employeeId" class="label">Employee ID</label>
            <input
              id="employeeId"
              [(ngModel)]="employeeId"
              name="employeeId"
              type="text"
              placeholder="EMP26001"
              class="input-field"
              [disabled]="loading"
            />
          </div>

          <button type="submit" class="btn-primary w-full py-3" [disabled]="loading">
            <span *ngIf="!loading">Send Reset Link</span>
            <span *ngIf="loading" class="flex items-center justify-center gap-2">
              <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
              Sending...
            </span>
          </button>
        </form>

        <div class="mt-6 text-center">
          <a routerLink="/login" class="text-sm text-primary-600 hover:text-primary-700 font-medium">
            ← Back to Login
          </a>
        </div>

      </div>
    </div>
  </div>
</div>
