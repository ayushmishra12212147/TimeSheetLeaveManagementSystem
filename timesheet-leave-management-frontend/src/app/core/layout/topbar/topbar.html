<header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6">

  <!-- Left: Toggle + Page Title -->
  <div class="flex items-center gap-4">
    <button (click)="onToggleSidebar()"
            class="text-gray-500 hover:text-gray-700 p-1.5 rounded-lg hover:bg-gray-100 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <span class="text-lg font-semibold text-gray-800">TSLMS</span>
  </div>

  <!-- Right: User Info -->
  <div class="flex items-center gap-4">

    <!-- Notifications -->
    <a routerLink="/dashboard/notifications" class="relative p-2 text-gray-500 hover:text-primary-600 transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
      </svg>
      <span *ngIf="unreadCount > 0" class="absolute top-1 right-1 min-w-[20px] h-[20px] px-1 bg-red-500 text-white text-[11px] font-bold flex items-center justify-center rounded-full border-2 border-white shadow-sm">
        {{ unreadCount > 9 ? '9+' : unreadCount }}
      </span>
    </a>

    <!-- Employee ID Badge -->
    <span class="badge badge-info text-xs">{{ employeeId }}</span>

    <!-- User Avatar & Name -->
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-primary-600 text-white flex items-center justify-center text-sm font-semibold">
        {{ getInitials() }}
      </div>
      <div class="hidden sm:block">
        <p class="text-sm font-medium text-gray-800 leading-tight">{{ userName || employeeId }}</p>
        <p class="text-xs text-gray-500">{{ getRoleLabel() }}</p>
      </div>
    </div>

  </div>

</header>
